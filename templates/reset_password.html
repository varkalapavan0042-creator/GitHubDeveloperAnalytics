<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password | GitHub Developer Analytics</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <style>
    body{min-height:100vh;display:grid;place-items:center;background:#0f172a;color:#e5e7eb;font-family:Arial,sans-serif;padding:20px}
    .auth-card{width:min(100%,430px);background:#1e293b;border:1px solid #334155;border-radius:18px;padding:30px;box-shadow:0 20px 50px #0004}
    h1{margin-top:0}.muted{color:#cbd5e1;line-height:1.5}label{display:block;margin:18px 0 8px}
    input{width:100%;padding:12px;border:1px solid #475569;border-radius:8px;background:#0f172a;color:white;box-sizing:border-box}
    button{width:100%;margin-top:18px;padding:12px;border:0;border-radius:8px;background:#38bdf8;color:#082f49;font-weight:bold;cursor:pointer}
    a{color:#7dd3fc}.message{padding:10px;border-radius:8px;background:#334155;margin:10px 0}
  </style>
</head>
<body><main class="auth-card">
  <h1>Choose a new password</h1><p class="muted">Use at least 8 characters. This reset link can only be used once.</p>
  {% with messages = get_flashed_messages(with_categories=true) %}{% for category, message in messages %}<div class="message">{{ message }}</div>{% endfor %}{% endwith %}
  <form method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="password">New password</label><input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required>
    <label for="confirm_password">Confirm new password</label><input id="confirm_password" name="confirm_password" type="password" autocomplete="new-password" minlength="8" required>
    <button type="submit">Reset password</button>
  </form>
  <p><a href="{{ url_for('login') }}">Back to login</a></p>
</main></body></html>
