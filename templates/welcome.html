<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome | DevAnalytics</title>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: Arial, sans-serif;
            color: #f1f5f9;
            background: #080d19;
            padding: 20px;
        }

        .welcome {
            width: 100%;
            max-width: 520px;
            padding: 48px 32px;
            text-align: center;
            background: #111c30;
            border: 1px solid #293953;
            border-radius: 24px;
        }

        .logo {
            display: inline-grid;
            place-items: center;
            width: 64px;
            height: 64px;
            border-radius: 18px;
            background: linear-gradient(135deg, #4388ff, #7652e8);
            font-size: 24px;
            font-weight: bold;
        }

        h1 { font-size: 34px; margin-bottom: 12px; }
        h1 span { color: #70a5ff; }

        p { color: #9aabc4; line-height: 1.7; }

        .actions {
            display: flex;
            gap: 12px;
            margin-top: 30px;
        }

        .btn {
            flex: 1;
            padding: 14px 10px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: bold;
        }

        .primary {
            color: white;
            background: #4e79f6;
        }

        .secondary {
            color: #e2e8f0;
            border: 1px solid #40516e;
        }

        @media (max-width: 400px) {
            .actions { flex-direction: column; }
            h1 { font-size: 28px; }
        }
    </style>
</head>
<body>
    <main class="welcome">
        <div class="logo">GH</div>
        <h1>Dev<span>Analytics</span></h1>

        <p>
            Understand your GitHub journey.
            Explore developer profiles, repository activity,
            programming languages, stars and forks.
        </p>

        <div class="actions">
            <a class="btn primary"
               href="{{ url_for('login') }}">Log In</a>

            <a class="btn secondary"
               href="{{ url_for('register') }}">Create Account</a>
        </div>
    </main>
</body>
</html>
