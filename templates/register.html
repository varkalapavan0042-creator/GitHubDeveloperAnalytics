
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Register | DevAnalytics</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: #f8fafc;
        }

        .register-box {
            width: 100%;
            max-width: 400px;
            padding: 30px;
            background: #1e293b;
            border-radius: 14px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
        }

        h1 {
            margin-top: 0;
            text-align: center;
        }

        .subtitle {
            margin-bottom: 25px;
            text-align: center;
            color: #cbd5e1;
        }

        input {
            display: block;
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #475569;
            border-radius: 7px;
            background: #0f172a;
            color: white;
            font-size: 15px;
        }

        input:focus {
            outline: 2px solid #38bdf8;
            border-color: transparent;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 7px;
            background: #38bdf8;
            color: #082f49;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #7dd3fc;
        }

        a {
            color: #38bdf8;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        .message {
            padding: 10px;
            margin-bottom: 12px;
            border-radius: 6px;
            background: #334155;
        }

        .links {
            margin-top: 20px;
            text-align: center;
            line-height: 1.8;
        }
    </style>
</head>

<body>
    <main class="register-box">
        <h1>Create Account</h1>

        <p class="subtitle">
            Join DevAnalytics and explore GitHub statistics.
        </p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <p class="message {{ category }}">{{ message }}</p>
            {% endfor %}
        {% endwith %}

        <form method="POST" action="{{ url_for('register') }}">
            <input
                type="hidden"
                name="csrf_token"
                value="{{ csrf_token() }}"
            >

            <input
                type="text"
                name="name"
                placeholder="Full Name"
                autocomplete="name"
                maxlength="100"
                required
            >

            <input
                type="email"
                name="email"
                placeholder="Email Address"
                autocomplete="email"
                maxlength="254"
                required
            >

            <input
                type="password"
                name="password"
                placeholder="Create Password (minimum 8 characters)"
                autocomplete="new-password"
                minlength="8"
                required
            >

            <button type="submit">Create Account</button>
        </form>

        <div class="links">
            Already have an account?
            <a href="{{ url_for('login') }}">Log in</a>

            <p>
                <a href="{{ url_for('welcome') }}">Back to Welcome Page</a>
            </p>
        </div>
    </main>
</body>
</html>
